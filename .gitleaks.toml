# Общая конфигурация gitleaks для pre-commit и CI.
title = "AUTOforYOU gitleaks"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}\b'''
keywords = [":aa"]

[[rules]]
id = "apikey-query-value"
description = "apikey= с непустым значением"
regex = '''(?i)api[_-]?key=[A-Za-z0-9_\-]{8,}'''
keywords = ["apikey", "api_key", "api-key"]

[allowlist]
description = "Фиктивные значения из тестов и документации (по значению, не по путям)"
regexes = [
  '''SECRET123''',
  # Фиктивный новый пароль в тестах смены пароля (tests/test_authz_matrix.py)
  '''N3w-Str0ng-Pass-77''',
  # Фиктивный пароль в тестах регистрации и удаления аккаунта (tests/test_attribution.py, users/tests_account_data.py)
  '''Strong-Pass-9182''',
  # Фиктивные токен Telegram и пароль БД в тестах маскировки секретов (integrations/tests.py, задача 3.1)
  '''tok-12345-abc''',
  '''dbpass-Secret9''',
  # Плейсхолдеры шаблонов .env*.example и документации: KEY=your_...
  '''(?i)api[_-]?key=your_[a-z0-9_]*''',
]
stopwords = ["secret123", "test_key"]
