# ВРЕМЕННЫЙ: диагностика segfault при завершении тест-раннера (PR #37). Удалить до мержа.
name: segv-debug

on:
  pull_request:
    branches: [main]

jobs:
  gdb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["telegram_bot", ""]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoforyou
          POSTGRES_USER: autoforyou
          POSTGRES_PASSWORD: autoforyou_ci
        options: >-
          --health-cmd "pg_isready -U autoforyou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      SECRET_KEY: ci-secret-key-not-used-in-prod
      DEBUG: "true"
      DATABASE_URL: postgres://autoforyou:autoforyou_ci@localhost:5432/autoforyou
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y -q gdb > /dev/null
      - name: Tests under gdb
        run: |
          gdb -q -batch -ex run -ex "bt 40" -ex "py-bt" \
            --args python manage.py test ${{ matrix.suite }} --noinput 2>&1 \
            | grep -vE '^\s*(test_|ok$)|\.\.\. ok$' | tail -80
