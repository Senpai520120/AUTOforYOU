name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Секреты: gitleaks по рабочему дереву (история не сканируется, см. задачу 1.1) ───
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks dir (working tree)
        # TODO владельцу: закрепить образ по digest (zricethezav/gitleaks:v8.21.2@sha256:...).
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2             dir . --config .gitleaks.toml --redact --verbose

  # ─── Backend: линтер + системные проверки + миграции + тесты ───
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoforyou
          POSTGRES_USER: autoforyou
          POSTGRES_PASSWORD: autoforyou_ci
        options: >-
          --health-cmd "pg_isready -U autoforyou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      SECRET_KEY: ci-secret-key-not-used-in-prod
      DEBUG: "true"
      DATABASE_URL: postgres://autoforyou:autoforyou_ci@localhost:5432/autoforyou
      LIQPAY_PUBLIC_KEY: dummy
      LIQPAY_PRIVATE_KEY: dummy
      # Пустой токен обязателен: post_save на Listing запускает
      # post_listing_to_channel, а в тестах CELERY_TASK_ALWAYS_EAGER=True.
      # С реальным токеном тесты стучались бы в api.telegram.org.
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Shell scripts use LF
        run: |
          git ls-files --eol -- '*.sh' | awk '$1 != "i/lf" {print; bad=1} END {exit bad}'
          ! grep -lU $'\r' $(git ls-files '*.sh')
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --no-input
      - name: Run tests
        run: python manage.py test --verbosity=2

      # openapi.yaml отставал от кода: описывал 13 путей из 60 и версию 1.0.0
      # вместо 2.0.0. Проверка не даёт схеме разъехаться снова.
      #
      # Важно: схема зависит от СУБД. drf-spectacular берёт границы числовых
      # полей из бэкенда БД, и на SQLite IntegerField выходит 64-битным
      # (maximum: 9223372036854775807), а на PostgreSQL — int32 (2147483647),
      # PositiveSmallIntegerField — int16 (32767). Поэтому файл генерируется
      # против PostgreSQL, как в проде. Локально:
      #   DATABASE_URL=postgresql://... python manage.py spectacular --file openapi.yaml
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.generated.yaml
          if ! diff -q openapi.yaml /tmp/openapi.generated.yaml > /dev/null; then
            echo "::error::openapi.yaml устарел. Сгенерируйте против PostgreSQL: DATABASE_URL=postgresql://... python manage.py spectacular --file openapi.yaml"
            diff openapi.yaml /tmp/openapi.generated.yaml | head -40
            exit 1
          fi
          echo "openapi.yaml актуален"

  # ─── Frontend: линтер + типы + сборка ───
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_SITE_URL: http://localhost

  # ─── Скрипты бэкапа (7.4): shellcheck, LF, ротация и поведение backup.sh на заглушках ───
  backup-scripts:
    name: Backup scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck docker/backup/*.sh scripts/backup.sh scripts/restore.sh scripts/backup-verify.sh scripts/tests/test_backup_rotation.sh
      - name: Only LF in shell scripts
        run: |
          if grep -lI $'\r' docker/backup/*.sh scripts/*.sh scripts/tests/*.sh; then echo "CRLF found in *.sh" >&2; exit 1; fi
      - name: Rotation and backup.sh tests
        run: ./scripts/tests/test_backup_rotation.sh

  # ─── E2E: Playwright против полного стека в Docker ───
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      # Стек читает только .env.e2e (override), боевой .env не подхватывается.
      DC: docker compose -p autoforyou-e2e --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env.e2e for the stack
        run: |
          cp .env.e2e.example .env.e2e
          {
            echo "SECRET_KEY=$(head -c 50 /dev/urandom | base64 | tr -d '\n/+=' | head -c 50)"
            echo "POSTGRES_PASSWORD=ci_$(head -c 12 /dev/urandom | base64 | tr -d '\n/+=')"
            echo "REDIS_PASSWORD=ci_$(head -c 18 /dev/urandom | base64 | tr -d '\n/+=')"
          } >> .env.e2e
          # Пароль Redis (7.3, C9): REDIS_URL пересобираем под сгенерированный, как DATABASE_URL.
          R_PASS=$(grep '^REDIS_PASSWORD=' .env.e2e | tail -1 | cut -d= -f2)
          echo "REDIS_URL=redis://:${R_PASS}@redis:6379/0" >> .env.e2e
          # DATABASE_URL из шаблона содержит пароль по умолчанию — пересобираем
          # его под сгенерированный.
          PG_PASS=$(grep '^POSTGRES_PASSWORD=' .env.e2e | tail -1 | cut -d= -f2)
          echo "DATABASE_URL=postgres://autoforyou:${PG_PASS}@db:5432/autoforyou" >> .env.e2e
          echo "POSTGRES_USER=autoforyou" >> .env.e2e
          echo "POSTGRES_DB=autoforyou" >> .env.e2e
          # Стек поднимается с DEBUG=false — как в проде. TLS здесь нет: TLS_MODE=off
          # (nginx только :80, Django без SSL-редиректа и HSTS; задача 7.1).
          echo "TLS_MODE=off" >> .env.e2e
          # Только для тестового стека: разрешение e2e_seed и случайный пароль
          # тестовых пользователей (маскируем в логах).
          E2E_PASS="e2e_$(head -c 18 /dev/urandom | base64 | tr -d '[:space:]/+=')"
          echo "::add-mask::${E2E_PASS}"
          echo "E2E_SEED_ALLOWED=true" >> .env.e2e
          echo "E2E_PASSWORD=${E2E_PASS}" >> .env.e2e
          echo "E2E_PASSWORD=${E2E_PASS}" >> "$GITHUB_ENV"
          echo "==== .env.e2e (без значений) ===="
          cut -d= -f1 .env.e2e | grep -v '^#' | grep -v '^$' | sort -u

      - name: Fake production .env (override must ignore it)
        run: echo "TELEGRAM_BOT_TOKEN=ci-fake-prod-token" > .env

      - name: nginx -t for every TLS_MODE (7.1)
        run: |
          for mode in off external selfsigned letsencrypt; do
            for cf in false; do
              docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1                 -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e TLS_MODE="$mode" -e CLOUDFLARE_PROXY="$cf" -e TRUSTED_PROXY_IPS=10.0.0.0/8                 nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && nginx -t'
            done
          done
          # CAPTCHA_PROVIDER=turnstile: домен Turnstile сам попадает в CSP (иначе капча не загрузится).
          docker run --rm -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e TLS_MODE=off -e CAPTCHA_PROVIDER=turnstile \
            nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && grep -rq "challenges.cloudflare.com" /etc/nginx/'
          # Аналитика (3.5): домены GA4 и Cloudflare WA попадают в CSP только при заданных ID, без ID их нет.
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e TLS_MODE=off -e GA4_MEASUREMENT_ID=G-TEST000000 -e CLOUDFLARE_ANALYTICS_TOKEN=CFTEST0000000000             nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && nginx -t && grep -rq "www.googletagmanager.com" /etc/nginx/ && grep -rq "static.cloudflareinsights.com" /etc/nginx/'
          docker run --rm -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e TLS_MODE=off             nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && ! grep -rqE "googletagmanager|google-analytics|cloudflareinsights" /etc/nginx/'
          docker run --rm -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e TLS_MODE=off -e GA4_MEASUREMENT_ID='G-"><script>'             nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && ! grep -rqE "googletagmanager|google-analytics" /etc/nginx/'
          # Cloudflare без файла диапазонов: nginx обязан не стартовать с понятной ошибкой.
          if docker run --rm -v "$PWD/nginx:/nginx-src:ro" -e DOMAIN=ci.example.test -e CLOUDFLARE_PROXY=true               nginx:1.31-alpine sh -c '. /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh'; then
            echo "CLOUDFLARE_PROXY=true without ranges file must fail" >&2; exit 1
          fi

      - name: Compose config fails without secrets (C9, C13, 6.4)
        run: |
          # Положительный контроль: с четырьмя переменными конфиг валиден (иначе отказы ниже могли быть по другой причине).
          POSTGRES_PASSWORD=x REDIS_PASSWORD=x NEXT_PUBLIC_API_URL=http://x NEXT_PUBLIC_SITE_URL=http://x docker compose --env-file /dev/null config -q
          if POSTGRES_PASSWORD= REDIS_PASSWORD=x NEXT_PUBLIC_API_URL=http://x NEXT_PUBLIC_SITE_URL=http://x docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "empty POSTGRES_PASSWORD must fail docker compose config" >&2; exit 1
          fi
          if POSTGRES_PASSWORD=x REDIS_PASSWORD= NEXT_PUBLIC_API_URL=http://x NEXT_PUBLIC_SITE_URL=http://x docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "empty REDIS_PASSWORD must fail docker compose config" >&2; exit 1
          fi
          if POSTGRES_PASSWORD=x REDIS_PASSWORD=x docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "missing NEXT_PUBLIC_* must fail docker compose config" >&2; exit 1
          fi

      - name: Backend image has no secrets or dumps (C6, 7.3)
        run: |
          # Приманки: без них проверка зелёная и тогда, когда .dockerignore пуст (файлов просто нет в рабочей копии CI).
          # .env и .env.e2e уже созданы шагами выше.
          touch dump.sql .dev_secret_key .coverage
          mkdir -p pgdata private_media .claude
          touch private_media/x pgdata/x .claude/x
          docker build -f Dockerfile.backend -t afy-backend-check .
          test "$(docker run --rm afy-backend-check id -u)" = "10001"
          docker run --rm afy-backend-check sh -c 'test ! -e /app/dump.sql && test ! -e /app/pgdata && test ! -e /app/private_media && test ! -e /app/.env && test ! -e /app/.env.e2e && test ! -e /app/.claude && test ! -e /app/.coverage && test ! -e /app/.dev_secret_key'
          # Положительный контроль: тома и /tmp для app доступны на запись.
          docker run --rm afy-backend-check sh -c 'touch /app/media/x && touch /app/staticfiles/x && touch /tmp/x'
          # Код образа только для чтения: при RCE процесс app не должен переписать исходники. Проверяем весь /app.
          writable=$(docker run --rm afy-backend-check sh -c 'find /app -path /app/media -prune -o -path /app/staticfiles -prune -o -writable -print')
          if [ -n "$writable" ]; then
            echo "app can write inside /app:" >&2; echo "$writable" >&2; exit 1
          fi
          rm -rf dump.sql .dev_secret_key .coverage pgdata private_media .claude

      - name: Start the stack
        # --wait: ждём healthy у сервисов с healthcheck. bot без токена завершается кодом 0 - его не ждём.
        run: $DC up -d --build --wait --wait-timeout 300 backend frontend nginx celery_worker celery_beat

      - name: Containers are non-root, Redis requires a password (7.3)
        run: |
          test "$($DC exec -T backend id -u)" = "10001"
          test "$($DC exec -T frontend id -u)" != "0"
          # Без пароля: именно AuthenticationError (NOAUTH). Любое другое исключение (сеть, опечатка) - провал.
          $DC exec -T backend python -c "
          import sys, redis
          try:
              redis.Redis(host='redis').ping()
          except redis.exceptions.AuthenticationError:
              sys.exit(0)
          sys.exit(1)
          "
          # Положительный контроль: с паролем из REDIS_URL ping проходит (иначе проверка выше могла бы пройти по другой причине).
          $DC exec -T backend python -c "
          import os, sys, redis
          sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).ping() is True else 1)
          "

      - name: Check production .env is not visible in the stack
        run: |
          for svc in backend bot celery_worker celery_beat; do
            val=$($DC exec -T "$svc" printenv TELEGRAM_BOT_TOKEN || true)
            if [ -n "$val" ]; then echo "$svc sees production .env" >&2; exit 1; fi
          done
          test "$($DC exec -T backend printenv E2E_SEED_ALLOWED)" = "true"

      - name: Wait for the site
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost/ || true)
            if [ "$code" = "200" ]; then echo "site is up"; exit 0; fi
            sleep 5
          done
          echo "site did not come up in time" >&2
          $DC ps
          $DC logs --tail 100
          exit 1

      - name: Seed e2e data
        run: |
          # Сброс троттлинга (429 на логин/расчёт) — только на e2e-стеке.
          $DC exec -T redis redis-cli FLUSHALL
          $DC exec -T backend python manage.py e2e_seed
          # Подвал кэширует публичные настройки на 300 с. «Wait for the site» выше
          # отрисовал страницу до сида, и в кэше frontend остались пустые реквизиты.
          # Пересоздаём контейнер frontend (кэш fetch лежит в его файловой системе
          # и в памяти) и перезапускаем nginx, чтобы он взял новый адрес апстрима.
          $DC up -d --force-recreate --no-deps frontend
          $DC restart nginx
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost/terms || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "frontend did not come back after restart" >&2
          exit 1

      - name: Backup, restore, verify (7.4)
        run: |
          set -euo pipefail
          export COMPOSE_CMD="$DC"
          BKP_PASS="e2e_$(head -c 18 /dev/urandom | base64 | tr -d '[:space:]/+=')"
          {
            echo "BACKUP_S3_BUCKET=e2e-backups"
            echo "BACKUP_S3_ENDPOINT_URL=http://s3mock:9000"
            echo "BACKUP_S3_ACCESS_KEY_ID=test"
            echo "BACKUP_S3_SECRET_ACCESS_KEY=testtesttest"
            echo "BACKUP_ENCRYPTION_PASSPHRASE=${BKP_PASS}"
          } >> .env.e2e
          # Эмуляция S3 (moto) в сети стека. MinIO не используем: его образы больше не публикуются в Docker Hub.
          docker run -d --name afy-s3mock --network autoforyou-e2e_default --network-alias s3mock python:3.12-slim             sh -c "pip install -q 'moto[server]' && moto_server -H 0.0.0.0 -p 9000"
          for i in $(seq 1 90); do
            if $DC run --rm -T --no-deps --entrypoint sh backup -c 'wget -S -q -O /dev/null http://s3mock:9000/ 2>&1 | grep -q HTTP'; then break; fi
            sleep 2
          done
          $DC run --rm -T --no-deps -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=testtesttest -e AWS_DEFAULT_REGION=auto             --entrypoint aws backup --endpoint-url http://s3mock:9000 s3 mb s3://e2e-backups

          $DC exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model as g; g().objects.create_user(email='backup-check@e2e.test', password='x-Backup-check-1')"
          ./scripts/backup.sh --now
          # Каталог бэкапов создаёт контейнер (root, 700): на runner отдаём его пользователю, на сервере скрипты запускают через sudo.
          sudo chown -R "$(id -u):$(id -g)" backups
          dump=$(ls -1 backups/autoforyou_*.dump | tail -n 1)
          test -n "$dump"
          $DC exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model as g; g().objects.filter(email='backup-check@e2e.test').delete()"
          ./scripts/restore.sh "$dump" --yes
          test "$($DC exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model as g; print(g().objects.filter(email='backup-check@e2e.test').count())" | tail -n 1 | tr -d '[:space:]')" = "1"
          # Проверка на временной БД (рабочая не затрагивается) и из «облака»; чужая passphrase - отказ, метка не обновляется.
          ./scripts/backup-verify.sh --file "$dump"
          rm -f backups/.last_verify
          ./scripts/backup-verify.sh --from-remote
          test -f backups/.last_verify
          rm -f backups/.last_verify
          sed -i 's/^BACKUP_ENCRYPTION_PASSPHRASE=.*/BACKUP_ENCRYPTION_PASSPHRASE=wrong-passphrase/' .env.e2e
          if ./scripts/backup-verify.sh --from-remote 2> verify_err.log; then echo "wrong passphrase must fail" >&2; exit 1; fi
          grep -q "расшифровка не удалась" verify_err.log   # причина отказа - именно расшифровка, а не сеть или bucket
          test ! -e backups/.last_verify
          # Пароль шифрования не задан при заданном bucket: код != 0, в лог попадает «шифрование не настроено».
          sed -i 's/^BACKUP_ENCRYPTION_PASSPHRASE=.*/BACKUP_ENCRYPTION_PASSPHRASE=/' .env.e2e
          if ./scripts/backup.sh --now 2> err.log; then echo "no passphrase must fail" >&2; exit 1; fi
          grep -q "шифрование не настроено" err.log
          # Healthcheck: свежая метка = healthy; метка старше 26 часов = unhealthy.
          $DC run --rm -T --no-deps --entrypoint sh backup -c 'touch /backups/.last_success && /usr/local/bin/healthcheck.sh'
          if $DC run --rm -T --no-deps --entrypoint sh backup -c 'touch -t 202001010000 /backups/.last_success && /usr/local/bin/healthcheck.sh'; then
            echo "stale marker must be unhealthy" >&2; exit 1
          fi
          docker rm -f afy-s3mock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Resilience pages (7.1)
        run: |
          # Frontend остановлен: оформленная страница 503, без внешних хостов.
          $DC stop frontend
          code=$(curl -s -o /tmp/50x.html -w '%{http_code}' http://localhost/)
          test "$code" = "503"
          grep -q "Сервіс тимчасово недоступний" /tmp/50x.html
          if grep -Eq 'https?://' /tmp/50x.html; then echo "50x page has external links" >&2; exit 1; fi
          $DC start frontend
          # Backend остановлен: для /api/ JSON, не HTML-страница.
          $DC stop backend
          code=$(curl -s -o /tmp/api503.json -w '%{http_code}' http://localhost/api/v1/auth/csrf/)
          test "$code" = "503"
          grep -q '"detail"' /tmp/api503.json
          $DC start backend

      - name: Admin IP allow-list (C10, 7.1)
        run: |
          # Без ADMIN_ALLOWED_IPS /admin/ открыт (302 на логин), с чужим списком - 403.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/admin/)
          test "$code" != "403"
          sed -i '/^ADMIN_ALLOWED_IPS=/d' .env.e2e && echo "ADMIN_ALLOWED_IPS=203.0.113.1" >> .env.e2e
          $DC up -d --force-recreate --no-deps nginx
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/admin/ || true)
            if [ "$code" = "403" ]; then break; fi
            sleep 2
          done
          test "$code" = "403"
          # Подделка XFF адрес не подменяет: nginx смотрит на адрес соединения.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 203.0.113.1' http://localhost/admin/)
          test "$code" = "403"
          # Публичные страницы список не затрагивает.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          test "$code" = "200"
          sed -i '/^ADMIN_ALLOWED_IPS=/d' .env.e2e
          $DC up -d --force-recreate --no-deps nginx

      - name: Security headers on the TLS stand (selfsigned, 7.1)
        working-directory: frontend
        run: |
          cd ..
          # AUTH_COOKIE_SECURE=false (стенд без TLS) несовместим с TLS_MODE != off: backend не стартует.
          # NEXT_PUBLIC_* вшиваються при збірці: для https-стенду фронт перезбираємо з https-адресами,
          # інакше браузер іде на http://localhost (mixed content + CSP connect-src 'self').
          sed -i '/^TLS_MODE=/d;/^AUTH_COOKIE_SECURE=/d;/^NEXT_PUBLIC_API_URL=/d;/^NEXT_PUBLIC_SITE_URL=/d' .env.e2e
          { echo "TLS_MODE=selfsigned"; echo "AUTH_COOKIE_SECURE=true";
            echo "NEXT_PUBLIC_API_URL=https://localhost"; echo "NEXT_PUBLIC_SITE_URL=https://localhost"; } >> .env.e2e
          $DC up -d --build --force-recreate nginx backend frontend
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' -m 5 https://localhost/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          cd frontend
          E2E_BASE_URL=https://localhost E2E_TLS_STAND=1 npx playwright test security-headers --project=tls
        env:
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Clean up e2e data
        if: always()
        run: $DC exec -T backend python manage.py e2e_cleanup

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: $DC logs --tail 200

  # ─── Deploy: только после зелёных проверок, только на push в main ───
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            /opt/autoforyou/redeploy.sh
