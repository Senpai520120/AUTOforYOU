name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: линтер + проверки + миграции ───
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoforyou
          POSTGRES_USER: autoforyou
          POSTGRES_PASSWORD: autoforyou_ci
        options: >-
          --health-cmd "pg_isready -U autoforyou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      SECRET_KEY: ci-secret-key-not-used-in-prod
      DEBUG: "true"
      DATABASE_URL: postgres://autoforyou:autoforyou_ci@localhost:5432/autoforyou
      LIQPAY_PUBLIC_KEY: dummy
      LIQPAY_PRIVATE_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .
      - name: Django system check
        run: python manage.py check --deploy --fail-level WARNING 2>&1 | grep -v "^System check" || true
      - name: Run migrations
        run: python manage.py migrate --no-input

  # ─── Frontend: линтер + сборка ───
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost

  # ─── Deploy: только после успешных backend + frontend, только на push в main ───
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            /opt/autoforyou/redeploy.sh
