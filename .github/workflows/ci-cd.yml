name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: линтер + системные проверки + миграции + тесты ───
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoforyou
          POSTGRES_USER: autoforyou
          POSTGRES_PASSWORD: autoforyou_ci
        options: >-
          --health-cmd "pg_isready -U autoforyou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      SECRET_KEY: ci-secret-key-not-used-in-prod
      DEBUG: "true"
      DATABASE_URL: postgres://autoforyou:autoforyou_ci@localhost:5432/autoforyou
      LIQPAY_PUBLIC_KEY: dummy
      LIQPAY_PRIVATE_KEY: dummy
      # Пустой токен обязателен: post_save на Listing запускает
      # post_listing_to_channel, а в тестах CELERY_TASK_ALWAYS_EAGER=True.
      # С реальным токеном тесты стучались бы в api.telegram.org.
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .
      - name: Django system check
        run: python manage.py check
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Run migrations
        run: python manage.py migrate --no-input
      - name: Run tests
        run: python manage.py test --verbosity=2

  # ─── Frontend: линтер + типы + сборка ───
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost

  # ─── E2E: Playwright против полного стека в Docker ───
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env for the stack
        run: |
          cp .env.docker.example .env
          {
            echo "SECRET_KEY=$(head -c 50 /dev/urandom | base64 | tr -d '\n/+=' | head -c 50)"
            echo "POSTGRES_PASSWORD=ci_$(head -c 12 /dev/urandom | base64 | tr -d '\n/+=')"
          } >> .env
          # DATABASE_URL из шаблона содержит пароль по умолчанию — пересобираем
          # его под сгенерированный.
          PG_PASS=$(grep '^POSTGRES_PASSWORD=' .env | tail -1 | cut -d= -f2)
          echo "DATABASE_URL=postgres://autoforyou:${PG_PASS}@db:5432/autoforyou" >> .env
          echo "POSTGRES_USER=autoforyou" >> .env
          echo "POSTGRES_DB=autoforyou" >> .env
          # Стек поднимается с DEBUG=false — как в проде. Но TLS здесь нет,
          # и без этого Django редиректил бы весь HTTP на HTTPS.
          echo "SECURE_SSL_REDIRECT=false" >> .env
          echo "==== .env (без значений) ===="
          cut -d= -f1 .env | grep -v '^#' | grep -v '^$' | sort -u

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the site
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost/ || true)
            if [ "$code" = "200" ]; then echo "site is up"; exit 0; fi
            sleep 5
          done
          echo "site did not come up in time" >&2
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

  # ─── Deploy: только после зелёных проверок, только на push в main ───
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            /opt/autoforyou/redeploy.sh
