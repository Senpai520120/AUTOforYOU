# Лимит на вход/регистрацию/админ-логин (12-S10): 20 в минуту с IP, всплеск 10.
# Грубая сетка поверх точных лимитов Django (THROTTLE_LOGIN_RATE и блокировка по аккаунту).
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# /media/ (задача 1.10, 12-S7): всё, что не картинка, отдаётся только как вложение,
# браузер не отрисует загруженный HTML/SVG на нашем домене.
map $uri $media_disposition {
    ~*\.(jpe?g|png|webp)$  "";
    default                 "attachment";
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 20M;

    # ─── Django static files (collectstatic output) ──────────────────────────
    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ─── User-uploaded media files ────────────────────────────────────────────
    location /media/ {
        alias /media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition $media_disposition always;
    }

    # Фото трекинга до sanitize_existing_images лежали тут публично — больше не отдаём (задача 1.10).
    location /media/tracking_photos/ {
        return 404;
    }

    # ─── Приватные файлы (фото трекинга) ─────────────────────────────────────
    # Только через X-Accel-Redirect из Django после проверки прав
    # (PRIVATE_MEDIA_USE_X_ACCEL=true). Прямой запрос снаружи — 404.
    location /protected-media/ {
        internal;
        alias /private_media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # ─── Вход/регистрация/вход в админку: limit_req по IP (12-S10) ─────────────
    # Тот же proxy-блок, что ниже. 429 вместо дефолтного 503.
    location ~ ^/(api/v1/auth/(token|register)|admin/login)/$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Django API and admin panel ───────────────────────────────────────────
    # XFF = $remote_addr (12-S9): подменённый клиентом XFF отбрасывается, DRF берёт
    # последний элемент (NUM_PROXIES=1). За внешним балансировщиком (Cloudflare и т.п.)
    # нужны real_ip_header + set_real_ip_from и NUM_PROXIES=2 — пункт LAUNCH_CHECKLIST.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Next.js frontend (everything else) ──────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev server HMR (not needed in production, but harmless)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ─── SSL placeholder — for production deployment ──────────────────────────
    # Uncomment and configure when deploying with a real domain + certificate:
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
