upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # ─── Django static files (collectstatic output) ──────────────────────────
    location /static/ {
        alias /static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ─── User-uploaded media files ────────────────────────────────────────────
    location /media/ {
        alias /media/;
        expires 7d;
    }

    # ─── Django API and admin panel ───────────────────────────────────────────
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Next.js frontend (everything else) ──────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev server HMR (not needed in production, but harmless)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # ─── SSL placeholder — for production deployment ──────────────────────────
    # Uncomment and configure when deploying with a real domain + certificate:
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
