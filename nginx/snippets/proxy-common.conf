# Общие proxy-настройки. XFF = $remote_addr (12-S9, задача 1.5): подменённый клиентом XFF
# отбрасывается, DRF берёт последний элемент (NUM_PROXIES=1). За Cloudflare $remote_addr уже
# заменён модулем real_ip (CLOUDFLARE_PROXY=true).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_connect_timeout 60s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
# Единственный источник этих заголовков - nginx (иначе дубли от Django и Next).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
