# Ограничение логов контейнеров (задача 7.2, 12-S8): размер и число файлов, по времени json-file не чистит.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

services:

  # ─── PostgreSQL database ─────────────────────────────────────────────────────
  db:
    logging: *default-logging
    image: postgres:18-alpine
    ports:
      # Только на localhost — внешний доступ через SSH-туннель; снаружи не видно.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoforyou}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
    volumes:
      # PG18+ требует монтировать /var/lib/postgresql (без /data)
      # и сам создаёт подпапку 18/main/ внутри volume.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autoforyou}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─── Redis (cache + Celery broker) ───────────────────────────────────────────
  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped

  # ─── Django backend (Gunicorn) ────────────────────────────────────────────────
  backend:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/app/docker/entrypoint.sh"]
    env_file: .env
    environment:
      # Тот же режим TLS, что у nginx (задача 7.1). Пусто (старый .env без TLS_MODE) = прежнее поведение
      # Django: SSL-редирект и HSTS включены. Принудительного off по умолчанию нет.
      TLS_MODE: ${TLS_MODE:-}
      DOMAIN: ${DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - static:/app/staticfiles
    # Gunicorn starts only after migrate+collectstatic finish; nginx waits for this.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',8000),2); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        # Baked into client-side JS at build time (browser uses nginx on port 80)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS:-}
    environment:
      NODE_ENV: production
      # Runtime env for Next.js SSR calls — uses Docker internal network
      INTERNAL_API_URL: http://backend:8000
      # Фото для OG-картинок: /media/ в проді віддає nginx (том media), не Django (задача 6.3b).
      INTERNAL_MEDIA_URL: ${INTERNAL_MEDIA_URL:-http://nginx}
    restart: unless-stopped

  # ─── Telegram bot (disabled if TELEGRAM_BOT_TOKEN is not set) ────────────────
  bot:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/app/docker/bot_entrypoint.sh"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # on-failure: не перезапускается при exit 0 (нет токена или TELEGRAM_UPDATES_MODE=webhook:
    # webhook установлен, апдейты принимает backend). Падение (ненулевой код) - перезапуск.
    restart: on-failure

  # ─── Celery worker ────────────────────────────────────────────────────────────
  celery_worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    env_file: .env
    environment:
      # Force DEBUG=false so settings.py uses Redis broker (not memory://).
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── Celery beat (scheduler) ──────────────────────────────────────────────────
  celery_beat:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
      - celery
      - -A
      - core
      - beat
      - -l
      - info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      # Force DEBUG=false so settings.py uses Redis broker (not memory://).
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    logging: *default-logging
    image: nginx:alpine
    # Конфиг собирается из шаблонов nginx/templates по .env (задача 7.1): TLS_MODE, DOMAIN, CSP_*, HSTS_*.
    # Скрипт подключается через `.`, а не через /docker-entrypoint.d: не зависит от бита исполнения файла.
    entrypoint: ["/bin/sh", "-c", ". /nginx-src/docker-entrypoint.d/15-afy-nginx-setup.sh && exec /docker-entrypoint.sh \"$$@\"", "--"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DOMAIN_WWW: ${DOMAIN_WWW:-false}
      TLS_MODE: ${TLS_MODE:-off}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
      CSP_SCRIPT_SRC_EXTRA: ${CSP_SCRIPT_SRC_EXTRA:-}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
      CSP_FRAME_SRC_EXTRA: ${CSP_FRAME_SRC_EXTRA:-}
      CSP_IMG_SRC_EXTRA: ${CSP_IMG_SRC_EXTRA:-}
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-20M}
      NGINX_AUTH_RATE: ${NGINX_AUTH_RATE:-20r/m}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      CLOUDFLARE_PROXY: ${CLOUDFLARE_PROXY:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-honeypot}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # Шаблоны, сниппеты, страница 50x, список IP Cloudflare: всё из каталога nginx/.
      - ./nginx:/nginx-src:ro
      - static:/static:ro
      - media:/media:ro
      # Приватные файлы (internal-location /protected-media/, задача 1.10).
      - private_media:/private_media:ro
      # Сертификаты Let's Encrypt (переживают `docker compose down`) и webroot для ACME-challenge.
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  # ─── Certbot: автопродление сертификата (профиль letsencrypt) ────────────────────
  # Первый сертификат получает scripts/init-letsencrypt.sh. Запуск: docker compose --profile letsencrypt up -d
  certbot:
    logging: *default-logging
    image: certbot/certbot
    profiles: ["letsencrypt"]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

volumes:
  postgres_data:
  static:
  media:
  private_media:
  letsencrypt:
  certbot_www:
