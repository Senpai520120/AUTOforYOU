  /api/v1/pricing/calculate/:
    post:
      operationId: v1_pricing_calculate_create
      description: |-
        Рассчитывает полную стоимость автомобиля в Украине: аукционный сбор (buyer fee + gate + environmental + virtual bid), логистика США, морской фрахт, доставка ЕС→UA, растаможка.

        **Важно**: результат всегда `is_estimate: true`. Ставки аукционных сборов — baseline (сверить с тарифом брокера). Ставки акциза и пенсионного сбора — требуют проверки по законодательству.
      summary: Калькулятор стоимости «под ключ»
      tags:
      - pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateInputRequest'
            examples:
              ToyotaCamry2019Бензин2500cc$10000(broker/secured/salvage):
                value:
                  auction_price_usd: '10000.00'
                  engine_cc: 2500
                  fuel_type: petrol
                  vehicle_year: 2019
                  auction: copart
                  member_type: broker
                  payment_type: secured
                  title_type: salvage
                  auction_location: general
                  us_port: houston
                  eu_port: klaipeda
                summary: Toyota Camry 2019 бензин 2500cc $10 000 (broker/secured/salvage)
              TeslaModel32022Электро$25000:
                value:
                  auction_price_usd: '25000.00'
                  engine_cc: 1
                  fuel_type: electric
                  vehicle_year: 2022
                  auction: copart
                  member_type: broker
                  payment_type: secured
                  title_type: salvage
                  auction_location: california
                  us_port: houston
                  eu_port: gdansk
                summary: Tesla Model 3 2022 электро $25 000
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculateInputRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Расчёт выполнен, снимок сохранён
        '400':
          description: Ошибка валидации входных данных
        '422':
          description: Отсутствуют активные тарифы в БД
