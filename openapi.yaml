  /api/v1/vehicles/{vin}/decode/:
    get:
      operationId: v1_vehicles_decode_retrieve
      description: |-
        Декодирует VIN через бесплатный API NHTSA vPIC (федеральная база США).

        Возвращает технические характеристики: марку, модель, год, объём двигателя, тип топлива, тип кузова. Результат кэшируется — повторный запрос не обращается к NHTSA.

        История ДТП и торги — отдельный эндпоинт `/report/` (заглушка, требует Carfax/BidFax).

        `demo: false` — данные реальные из NHTSA.
      summary: VIN-декод через NHTSA vPIC
      parameters:
      - in: path
        name: vin
        schema:
          type: string
        required: true
      tags:
      - vehicles
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Технические данные из NHTSA vPIC
        '400':
          description: Некорректный VIN
  /api/v1/vehicles/{vin}/registry/:
    get:
      operationId: v1_vehicles_registry_retrieve
      description: |-
        Повертає дані з українських реєстрів: власники, пробіг, обтяження (арешти/застави).

        Результат кешується — повторний запрос по тому ж VIN/номеру не звертається до API.

        **Без ключа** (`OPENDATABOT_API_KEY` не задано): `demo: true`, безпечний fallback.

        **З ключем**: реальні дані з Opendatabot.
      summary: Перевірка по реєстрах України (Opendatabot)
      parameters:
      - in: query
        name: plate
        schema:
          type: string
        description: Держномер (наприклад AA1234BB). Якщо вказано — пошук за номером.
      - in: path
        name: vin
        schema:
          type: string
        description: VIN (17 символів) або `_` при пошуку за номером
        required: true
      tags:
      - vehicles
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Звіт реєстру (реальний або демо)
        '400':
          description: Некоректний VIN або не вказано ані VIN, ані номер
  /api/v1/vehicles/{vin}/report/:
    get:
      operationId: v1_vehicles_report_retrieve
      description: |-
        Возвращает агрегированный отчёт по VIN: история аварий, торги, реестры UA.

        **Важно**: данные кэшируются в БД. При отсутствии ключей провайдера возвращаются демо-данные с полем `demo: true` и меткой «Демо-данные» в UI.
      summary: VIN-отчёт
      parameters:
      - in: path
        name: vin
        schema:
          type: string
        required: true
      tags:
      - vehicles
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Отчёт (реальный или демо)
        '400':
          description: Некорректный VIN
components:
  schemas:
    ActiveRatesResponse:
      type: object
      properties:
        auction_fee_tiers:
          type: array
          items: {}
        auction_fixed_fees:
          type: array
          items: {}
        us_land_routes:
          type: array
          items: {}
        ocean_freight:
          type: array
          items: {}
        eu_to_ua:
          type: array
          items: {}
        exchange_rates:
          type: array
          items: {}
        excise_rates:
          type: array
          items: {}
        pension_brackets:
          type: array
          items: {}
      required:
      - auction_fee_tiers
      - auction_fixed_fees
      - eu_to_ua
      - exchange_rates
      - excise_rates
      - ocean_freight
      - pension_brackets
      - us_land_routes
    ArrivalPortEuEnum:
      enum:
      - klaipeda
      - gdansk
      type: string
    AuctionEnum:
      enum:
      - copart
      - iaai
      type: string
    BodyTypeEnum:
      enum:
      - sedan
      - suv
      - hatchback
      - wagon
      - coupe
      - minivan
      - pickup
      - convertible
      - other
      type: string
    CalculateInputRequest:
      type: object
      properties:
        auction_price_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        engine_cc:
          type: integer
          maximum: 10000
          minimum: 0
        fuel_type:
          $ref: '#/components/schemas/CustomsExciseFuelTypeEnum'
        vehicle_year:
          type: integer
          maximum: 2100
          minimum: 1900
        battery_capacity_kwh:
          type: integer
          maximum: 200
          minimum: 0
          default: 0
        auction:
          allOf:
          - $ref: '#/components/schemas/AuctionEnum'
          default: copart
        member_type:
          allOf:
          - $ref: '#/components/schemas/MemberTypeEnum'
          default: broker
        payment_type:
          allOf:
          - $ref: '#/components/schemas/PaymentTypeEnum'
          default: secured
        title_type:
          allOf:
          - $ref: '#/components/schemas/TitleTypeEnum'
          default: salvage
        auction_location:
          type: string
          minLength: 1
          default: general
          maxLength: 100
        us_port:
          type: string
          minLength: 1
          default: houston
          maxLength: 50
        eu_port:
          allOf:
          - $ref: '#/components/schemas/EuPortEnum'
          default: klaipeda
        calculation_date:
          type: string
          format: date
          nullable: true
      required:
      - auction_price_usd
      - engine_cc
      - fuel_type
      - vehicle_year
    Calculation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
          title: Пользователь
