openapi: 3.0.3
info:
  title: AUTOforYOU API
  version: 2.0.0
  description: |-
    Маркетплейс для автоперекупщиков: импорт битых авто с аукционов США (Copart/IAAI), калькулятор стоимости «под ключ» в Украину, каталог объявлений.

    **Аутентификация**: Bearer JWT. Получить токен: `POST /api/v1/auth/token/`.

    ⚠ **Тестовые тарифы** — все расчёты демонстрационные до подключения реальных ставок.
paths:
  /api/calculate/:
    get:
      operationId: calculate_retrieve
      description: Устаревший эндпоинт. Используйте POST /api/v1/pricing/calculate/
        вместо него.
      summary: '[УСТАРЕЛО] Калькулятор растаможки'
      tags:
      - legacy
      security:
      - jwtAuth: []
      - {}
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCalcResponse'
          description: ''
  /api/list/:
    get:
      operationId: list_list
      summary: '[УСТАРЕЛО] Список Car'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - legacy
      security:
      - jwtAuth: []
      - {}
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCarList'
          description: ''
  /api/v1/auth/me/calculations/:
    get:
      operationId: v1_auth_me_calculations_list
      summary: История моих расчётов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCalculationList'
          description: ''
  /api/v1/auth/me/shipments/:
    get:
      operationId: v1_auth_me_shipments_list
      summary: Мои отслеживаемые контейнеры
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShipmentListList'
          description: ''
  /api/v1/auth/me/trusted-shops/:
    get:
      operationId: v1_auth_me_trusted_shops_list
      summary: Мои проверенные партнёры (СТО, маляры, запчасти)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrustedShopList'
          description: ''
    post:
      operationId: v1_auth_me_trusted_shops_create
      summary: Добавить партнёра
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedShop'
          description: ''
  /api/v1/auth/me/trusted-shops/{id}/:
    get:
      operationId: v1_auth_me_trusted_shops_retrieve
      summary: Детали партнёра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedShop'
          description: ''
    put:
      operationId: v1_auth_me_trusted_shops_update
      summary: Обновить партнёра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrustedShopRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedShop'
          description: ''
    patch:
      operationId: v1_auth_me_trusted_shops_partial_update
      summary: Частично обновить партнёра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTrustedShopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTrustedShopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTrustedShopRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedShop'
          description: ''
    delete:
      operationId: v1_auth_me_trusted_shops_destroy
      summary: Удалить партнёра
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      summary: Получить профиль текущего пользователя
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: v1_auth_profile_update
      summary: Обновить профиль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: v1_auth_profile_partial_update
      summary: Частично обновить профиль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      summary: Регистрация нового пользователя
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Получить JWT-токены (login)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/logout/:
    post:
      operationId: v1_auth_token_logout_create
      description: Помещает переданный refresh-токен в blacklist. После этого им нельзя
        получить новый access.
      summary: Выход из системы (отзыв refresh-токена)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Обновить access-токен
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/b2b/board/:
    get:
      operationId: v1_b2b_board_list
      description: Только для верифицированных перекупщиков (is_verified_dealer=true).
        Возвращает wholesale-листинги, срочные выкупы вверху.
      summary: B2B-доска опта
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - b2b
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
  /api/v1/dealers/application/:
    get:
      operationId: v1_dealers_application_retrieve
      description: Возвращает последнюю заявку текущего пользователя (или 404).
      summary: Статус собственной заявки
      tags:
      - dealers
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/dealers/apply/:
    post:
      operationId: v1_dealers_apply_create
      description: Создаёт заявку со статусом pending. Повторная подача при наличии
        pending-заявки возвращает 409.
      summary: Подать заявку на статус дилера
      tags:
      - dealers
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/:
    get:
      operationId: v1_deals_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_deals_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/{id}/cancel/:
    post:
      operationId: v1_deals_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/{id}/confirm/:
    post:
      operationId: v1_deals_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/{id}/review/:
    post:
      operationId: v1_deals_review_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/listing-buyers/{listing_id}/:
    get:
      operationId: v1_deals_listing_buyers_retrieve
      description: Returns list of users who initiated conversations about a listing
        (for seller to choose buyer).
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/deals/seller-rating/{user_id}/:
    get:
      operationId: v1_deals_seller_rating_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/favorites/:
    get:
      operationId: v1_favorites_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_favorites_create
      description: 'Add to favorites. Body: {listing_type: ''local''|''imported'',
        listing_id: <int>}'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_favorites_destroy
      description: 'Remove from favorites. Body: {listing_type, listing_id}'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/favorites/status/:
    get:
      operationId: v1_favorites_status_retrieve
      description: Check if current user has favorited a specific listing.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/listings/:
    get:
      operationId: v1_listings_list
      description: Возвращает только retail-листинги. Wholesale скрыт.
      summary: Каталог объявлений (розница)
      parameters:
      - in: query
        name: channel
        schema:
          type: string
        description: retail | wholesale
      - in: query
        name: currency
        schema:
          type: string
        description: USD | UAH | EUR
      - in: query
        name: fuel_type
        schema:
          type: string
        description: petrol | diesel | electric | hybrid
      - in: query
        name: max_price
        schema:
          type: number
        description: Максимальная цена
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по марке, модели, VIN
      - in: query
        name: status
        schema:
          type: string
        description: in_transit | in_stock | sold
      tags:
      - listings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
  /api/v1/listings/{id}/:
    get:
      operationId: v1_listings_retrieve
      summary: Детали объявления
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/v1/listings/create/:
    post:
      operationId: v1_listings_create_create
      description: Требует авторизации.
      summary: Создать объявление
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingCreate'
          description: ''
  /api/v1/local/listings/:
    get:
      operationId: v1_local_listings_list
      summary: Каталог Україна — список активних оголошень
      parameters:
      - in: query
        name: body_type
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: integer
      - in: query
        name: fuel_type
        schema:
          type: string
      - in: query
        name: make
        schema:
          type: string
      - in: query
        name: mileage_max
        schema:
          type: integer
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: -created_at | created_at | price | -price
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - in: query
        name: region
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: transmission
        schema:
          type: string
      - in: query
        name: year_max
        schema:
          type: integer
      - in: query
        name: year_min
        schema:
          type: integer
      tags:
      - local
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocalListingListList'
          description: ''
    post:
      operationId: v1_local_listings_create
      description: Нове оголошення отримує статус pending і проходить модерацію.
      summary: Подати місцеве оголошення (авторизований)
      tags:
      - local
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalListingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocalListingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocalListingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalListingCreate'
          description: ''
  /api/v1/local/listings/{id}/:
    get:
      operationId: v1_local_listings_retrieve
      summary: Деталі місцевого оголошення
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - local
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalListingDetail'
          description: ''
    patch:
      operationId: v1_local_listings_partial_update
      summary: Редагувати своє оголошення
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - local
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLocalListingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLocalListingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLocalListingUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalListingUpdate'
          description: ''
    delete:
      operationId: v1_local_listings_destroy
      summary: Видалити своє оголошення
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - local
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/local/listings/{id}/contact/:
    get:
      operationId: v1_local_listings_contact_retrieve
      description: 'Повертає contact_phone. Обмеження: 20 запитів/год на акаунт.'
      summary: Отримати телефон продавця (тільки авторизований)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - local
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/local/listings/{id}/images/:
    post:
      operationId: v1_local_listings_images_create
      description: Завантажити одне або кілька фото. Перше фото стає головним, якщо
        головного ще немає.
      summary: Завантажити фото до оголошення (multipart)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - local
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
