          type: string
          title: Тип повреждения
          maxLength: 100
        source_auction:
          allOf:
          - $ref: '#/components/schemas/SourceAuctionEnum'
          title: Аукцион
        lot_number:
          type: string
          title: Номер лота
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - engine_cc
      - id
      - images
      - make
      - model
      - vin
      - year
    VehicleFuelTypeEnum:
      enum:
      - petrol
      - diesel
      - electric
      - hybrid
      type: string
    VehicleImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        source_url:
          type: string
          title: URL источника фото
          maxLength: 500
        is_primary:
          type: boolean
          title: Главное фото
      required:
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
