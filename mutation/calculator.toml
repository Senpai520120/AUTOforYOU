# Мутационное тестирование (cosmic-ray), запуск: scripts/mutation.sh calculator
[cosmic-ray]
module-path = "pricing/calculator.py"
timeout = 300.0
excluded-modules = []
test-command = "python manage.py test --failfast pricing.tests pricing.tests_correctness pricing.tests_fee_tables pricing.tests_fee_options pricing.tests_hybrid_excise pricing.tests_review_1116 pricing.tests_ua_delivery pricing.tests_resilience pricing.tests_mutation_survivors"

[cosmic-ray.distributor]
name = "local"

# Бессмысленные для Decimal/str мутанты: битовые операции, **, %, // падают TypeError
# сразу и только раздувают прогон. Сравнения ==/</> с is/is not — то же самое.
[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "core/ReplaceBinaryOperator_.*_(BitXor|BitOr|BitAnd|LShift|RShift|Pow|FloorDiv|Mod)$",
    "core/ReplaceBinaryOperator_(Pow|Mod|FloorDiv)_.*",
    "core/ReplaceComparisonOperator_(Eq|NotEq|Lt|LtE|Gt|GtE)_(Is|IsNot)$",
]
