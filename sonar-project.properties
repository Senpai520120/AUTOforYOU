# SonarQube (локальный сервер, http://localhost:9000). Запуск: bash scripts/sonar.sh
sonar.projectKey=autoforyou
sonar.projectName=AUTOforYOU
sonar.sourceEncoding=UTF-8
# В контейнере сканера git-worktree не читается (.git - ссылка на путь Windows).
sonar.scm.disabled=true

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,frontend/e2e/**,frontend/**/*.test.ts,frontend/**/*.test.tsx
sonar.exclusions=**/migrations/**,frontend/node_modules/**,frontend/.next/**,frontend/storybook-static/**,\
  frontend/test-results/**,frontend/playwright-report/**,.venv/**,.mutation/**,docs/**,**/*.html,openapi.yaml,\
  .claude/**,coverage.xml,staticfiles/**,media/**,private_media/**,pgdata/**,\
  **/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,frontend/e2e/**,frontend/**/*.test.ts,frontend/**/*.test.tsx
sonar.coverage.exclusions=frontend/**,scripts/**,manage.py,core/asgi.py,core/wsgi.py

sonar.python.version=3.12
# coverage xml -o coverage.xml (после coverage run manage.py test, см. .coveragerc)
sonar.python.coverage.reportPaths=coverage.xml
# Выжившие мутанты cosmic-ray: python scripts/mutation_to_sonar.py .mutation/*.sqlite
sonar.externalIssuesReportPaths=.mutation/sonar-issues.json
